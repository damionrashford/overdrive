name: Overdrive
options:
  bundleIdPrefix: com.damionrashford
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
configs:
  Debug: debug
  Release: release
  AppStore: release
settings:
  base:
    DEVELOPMENT_TEAM: AQ3Z98L6Y4
    CODE_SIGN_STYLE: Manual
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "2"
    ENABLE_HARDENED_RUNTIME: YES
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    DEAD_CODE_STRIPPING: YES
packages:
  OverdriveCore:
    path: .
targets:
  Overdrive:
    type: application
    platform: macOS
    sources:
      - path: Sources/Overdrive
      - path: Resources/Assets.xcassets
      - path: Resources/PrivacyInfo.xcprivacy
    dependencies:
      - package: OverdriveCore
        product: OverdriveCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.damionrashford.overdrive
        PRODUCT_NAME: Overdrive
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Xcode signs ad hoc; scripts/dist.sh re-signs with the real identity for distribution.
        CODE_SIGN_IDENTITY: "-"
        PROVISIONING_PROFILE_SPECIFIER: ""
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Config/Direct.entitlements
          OVERDRIVE_EDITION: direct
        Release:
          CODE_SIGN_ENTITLEMENTS: Config/Direct.entitlements
          OVERDRIVE_EDITION: direct
        AppStore:
          CODE_SIGN_ENTITLEMENTS: Config/AppStore.entitlements
          OVERDRIVE_EDITION: appstore
schemes:
  Overdrive:
    build:
      targets:
        Overdrive: all
    run:
      config: Debug
    archive:
      config: Release
  Overdrive App Store:
    build:
      targets:
        Overdrive: all
    run:
      config: AppStore
    archive:
      config: AppStore
